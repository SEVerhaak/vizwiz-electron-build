<!DOCTYPE html>
<html>

    <script src="lib/imageData.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }

        canvas {

            display: none; /* hidden by default */
        }
    </style>

<body>

<select id="presetSelect"></select>

<canvas id="canvas"></canvas>

</body>
</html>
